server:
  port: 8060

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0

spring:
  main:
    banner-mode: off
  cloud:
    discovery:
      enabled: true
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: hotel-service
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotel/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**