server:
  port: 8083

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0

spring:
  main:
    banner-mode: off
  cloud:
    discovery:
      enabled: true
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/db_payments"
    username: "upayment"
    password: "admin-password-upayment*"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true