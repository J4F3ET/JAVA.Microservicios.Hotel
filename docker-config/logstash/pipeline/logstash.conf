# logstash.conf
input {
  # 1. Input para recibir logs de Spring Boot a través de TCP/UDP
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Filtro para parsear el timestamp y otras transformaciones (opcional)
  # No es estrictamente necesario si Spring Boot envía un JSON limpio.
}

output {
  # 2. Output para enviar los datos a Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"] # Conexión a través de la red Docker
    index => "spring-boot-logs-%{+YYYY.MM.dd}" # Nombre del índice en ES
    user => "elastic"
    password => "elastic123"
    ssl_enabled => false # Asumimos que no estás usando SSL/HTTPS internamente
  }

  # Output adicional para ver los logs en la consola de Logstash (solo para depuración)
  stdout {
    codec => rubydebug
  }
}